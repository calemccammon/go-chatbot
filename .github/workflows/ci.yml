name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run internal tests
        run: go test ./internal/...

      - name: Run golangci-lint on internal packages
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./internal/...
